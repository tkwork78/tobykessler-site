  <title>Work Sample — Toby Kessler</title>
  <link rel="icon" href="images/favicon.svg?v=2" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap">
  <style>
    :root { --ink: #000; --paper: #fff; --grey-100: #f2f2f2; --grey-200: #e4e4e4; --grey-600: #666; --red: #e12d2d; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 24px; -webkit-font-smoothing: antialiased; }
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    /* Lock screen */
    .lock { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px; text-align: center; }
    .lock h1 { margin: 0; font-size: 40px; line-height: 48px; font-weight: 300; }
    .pass { display: flex; align-items: stretch; width: min(320px, 100%); border: 1px solid var(--grey-200); border-radius: 999px; background: var(--paper); transition: border-color .2s ease, background .2s ease; }
    .pass:focus-within { border-color: var(--ink); }
    .pass input { flex: 1; min-width: 0; padding: 11px 0 11px 22px; border: 0; background: none; outline: none; font: inherit; color: var(--ink); -webkit-user-select: text; user-select: text; }
    .pass input::placeholder { color: var(--grey-600); opacity: 1; }
    .pass button { flex: none; width: 48px; border: 0; border-radius: 999px; background: none; color: var(--ink); font: inherit; font-size: 18px; cursor: pointer; transition: background .2s ease, color .2s ease; }
    .pass button:hover { background: var(--ink); color: var(--paper); }
    .pass.is-red { border-color: var(--red); background: rgba(225, 45, 45, .08); }
    .pass.is-red input::placeholder, .pass.is-red button { color: #c81e1e; }
    .pass.is-wrong { animation: shake .4s ease; }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    /* Samples */
    .samples { display: none; padding: 64px 0 96px; }
    body.is-open .lock { display: none; }
    body.is-open .samples { display: block; }
    .samples > header h1 { margin: 0 0 8px; font-size: 40px; line-height: 48px; font-weight: 300; }
    .samples > header p { margin: 0; color: var(--grey-600); }
    .sample { margin-top: 72px; }
    .sample h2 { margin: 0 0 4px; font-size: 20px; line-height: 28px; font-weight: 400; }
    .sample .meta { margin: 0 0 20px; font-size: 14px; line-height: 20px; color: var(--grey-600); }
    .pages { display: flex; flex-direction: column; gap: 16px; }
    .sheet { position: relative; margin: 0 auto; width: 100%; background: var(--grey-100); }
    .sheet.portrait { max-width: 760px; }
    .sheet img { display: block; width: 100%; height: auto; pointer-events: none; -webkit-user-drag: none; user-select: none; }
    .sheet::after { content: ""; position: absolute; inset: 0; }   /* shield over the image */
    .sheet.portrait.paper img { box-shadow: 0 0 0 1px var(--grey-200); }
    footer { padding: 32px 0 48px; font-size: 14px; color: var(--grey-600); }

    @media (max-width: 600px) {
      .wrap { padding: 0 16px; }
      .samples { padding-top: 40px; }
      .sample { margin-top: 56px; }
      .pages { gap: 10px; }
    }
    @media print { body * { display: none !important; } }
  </style>
</head>
<body>
  <main class="lock">
    <h1>Work Sample</h1>
    <form class="pass" autocomplete="off">
      <label for="ws-pass" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Password</label>
      <input id="ws-pass" type="password" placeholder="Password" autocomplete="off" spellcheck="false" autofocus>
      <button type="submit" aria-label="Enter">→</button>
    </form>
  </main>

  <main class="samples wrap" aria-live="polite">
    <header>
      <h1>Work Sample</h1>
      <p>Toby Kessler</p>
    </header>
    <div data-samples></div>
    <footer>© <span data-year></span> Toby Kessler. All Rights Reserved.</footer>
  </main>

  <script src="js/work-sample.js?v=1"></script>

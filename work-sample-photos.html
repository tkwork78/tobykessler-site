<!doctype html>
<html lang="en">
<head>
  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EQ9WMNVFV4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-EQ9WMNVFV4');

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Unlisted page: not linked anywhere on the site. Files in data/ws are encrypted and only open with the password. -->
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <title>On-Site Photography</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap">
  <style>
    :root { --ink: #000; --paper: #fff; --grey-100: #f2f2f2; --grey-200: #e4e4e4; --grey-600: #666; --red: #e12d2d; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 24px; -webkit-font-smoothing: antialiased; }
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    /* Lock screen */
    .lock { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px; text-align: center; }
    .lock h1 { margin: 0; font-size: 40px; line-height: 48px; font-weight: 300; }
    .pass { display: flex; align-items: stretch; width: min(320px, 100%); border: 1px solid var(--grey-200); border-radius: 999px; background: var(--paper); transition: border-color .2s ease, background .2s ease; }
    .pass:focus-within { border-color: var(--ink); }
    .pass input { flex: 1; min-width: 0; padding: 11px 0 11px 22px; border: 0; background: none; outline: none; font: inherit; color: var(--ink); -webkit-user-select: text; user-select: text; }
    .pass input::placeholder { color: var(--grey-600); opacity: 1; }
    .pass button { flex: none; width: 48px; border: 0; border-radius: 999px; background: none; color: var(--ink); font: inherit; font-size: 18px; cursor: pointer; transition: background .2s ease, color .2s ease; }
    .pass button:hover { background: var(--ink); color: var(--paper); }
    .pass.is-red { border-color: var(--red); background: rgba(225, 45, 45, .08); }
    .pass.is-red input::placeholder, .pass.is-red button { color: #c81e1e; }
    .pass.is-wrong { animation: shake .4s ease; }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    /* Samples */
    .samples { display: none; padding: 64px 0 96px; }
    body.is-open .lock { display: none; }
    body.is-open .samples { display: block; }
    .samples > header h1 { margin: 0 0 8px; font-size: 40px; line-height: 48px; font-weight: 300; }
    .note { margin: 8px 0 0; font-weight: 300; color: var(--grey-600); }   /* same as the site's summary lines */
    /* One block per doc: cover in a grey box (whole page, never cropped), title and page count under it */
    .docs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px 32px; margin-top: 56px; }
    .doc { display: block; width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .doc-cover { position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 4 / 3; padding: 24px; background: var(--grey-100); transition: background .2s ease; }
    .doc:hover .doc-cover { background: var(--grey-200); }
    .doc-cover img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; box-shadow: 0 2px 12px rgba(0, 0, 0, .12); }
    .doc-title { display: block; margin-top: 12px; font-size: 18px; line-height: 26px; }
    .doc-meta { display: block; font-size: 14px; line-height: 20px; color: var(--grey-600); }
    .doc { position: relative; align-self: start; }
    .doc-desc { display: block; font-size: 14px; line-height: 20px; color: var(--ink); font-weight: 300; }
    .doc-badge { position: absolute; top: 12px; left: 12px; z-index: 1; padding: 3px 10px; border-radius: 999px; background: #1a5cff; color: #fff; font-size: 12px; line-height: 18px; }
    img { pointer-events: none; -webkit-user-drag: none; user-select: none; }
    .shield { position: absolute; inset: 0; }   /* covers images so they can't be grabbed */
    footer { padding: 72px 0 48px; font-size: 14px; color: var(--grey-600); }

    /* Viewer */
    .viewer { position: fixed; inset: 0; z-index: 10; display: none; background: var(--grey-100); }
    .viewer.is-open { display: block; }
    body.has-viewer { overflow: hidden; }
    .viewer-stage { position: absolute; inset: 64px 96px 72px; display: flex; align-items: center; justify-content: center; }
    .viewer-stage img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; box-shadow: 0 2px 16px rgba(0, 0, 0, .12); }
    .viewer-top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; padding: 0 24px; }
    .viewer-title { font-size: 16px; }
    .viewer-count { position: absolute; bottom: 0; left: 0; right: 0; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 14px; line-height: 20px; color: var(--grey-600); }
    .viewer-note { color: var(--ink); text-align: center; padding: 0 72px; }
    .viewer-note:empty { display: none; }
    .vbtn { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 0; border: 1px solid var(--grey-200); border-radius: 999px; background: var(--paper); color: var(--ink); font: inherit; font-size: 18px; cursor: pointer; transition: background .2s ease, color .2s ease, opacity .2s ease; }
    .vbtn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .vbtn[disabled] { opacity: .3; pointer-events: none; }
    .vprev, .vnext { position: absolute; top: 50%; margin-top: -24px; }
    .vprev { left: 24px; } .vnext { right: 24px; }
    .viewer.is-page .viewer-stage { overflow-y: auto; align-items: flex-start; -webkit-overflow-scrolling: touch; }
    .viewer.is-page .viewer-stage img { width: 100%; max-height: none; }
    /* Photo grid: three columns, every photo whole (no cropping) */
    .photos { columns: 3; column-gap: 16px; margin-top: 56px; }
    .photo { position: relative; display: block; width: 100%; margin: 0 0 16px; padding: 0; border: 0; background: var(--grey-100); cursor: pointer; break-inside: avoid; }
    .photo img { display: block; width: 100%; height: 100%; }
    @media (max-width: 1000px) { .photos { columns: 2; } }
    @media (max-width: 600px) { .photos { columns: 1; margin-top: 40px; } }
    .back { display: inline-block; margin-bottom: 16px; font-size: 14px; color: var(--grey-600); text-decoration: none; }
    .back:hover { color: var(--ink); }
    .viewer.is-single .vprev, .viewer.is-single .vnext, .viewer.is-single .viewer-count span { display: none; }
    .spin { width: 28px; height: 28px; border: 2px solid var(--grey-200); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1000px) { .docs { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) {
      .wrap { padding: 0 16px; }
      .samples { padding-top: 40px; }
      .docs { grid-template-columns: 1fr; gap: 40px; margin-top: 40px; }
      .viewer-top { padding: 0 16px; }
      .viewer-stage { inset: 64px 12px 88px; }
      .vprev, .vnext { top: auto; bottom: 12px; margin-top: 0; }
      .vprev { left: 16px; } .vnext { right: 16px; }
      .viewer-count { height: 72px; }
    }
    @media print { body * { display: none !important; } }
    /* Screen shield: covers the samples whenever a screenshot is likely (window not focused, screenshot keys held) */
    .shade { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 24px; background: var(--paper); color: var(--grey-600); font-size: 14px; text-align: center; }
    body.is-open.is-shaded .shade { display: flex; }
  </style>
</head>
<body data-index="photos.bin" data-grid>
  <main class="lock">
    <h1>Private Work Sample</h1>
    <form class="pass" autocomplete="off">
      <label for="ws-pass" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Password</label>
      <input id="ws-pass" type="password" placeholder="Password" autocomplete="off" spellcheck="false" autofocus>
      <button type="submit" aria-label="Enter">→</button>
    </form>
  </main>

  <main class="samples wrap" aria-live="polite">
    <header>
      <a class="back" href="work-sample.html">← Back To Work Sample</a>
      <h1>On-Site Photography For Progress Photos</h1>
      <p class="note">Confidential, Please Do Not Share.</p>
    </header>
    <div data-samples></div>
  </main>

  <div class="viewer" role="dialog" aria-modal="true" aria-label="Document viewer">
    <div class="viewer-top"><span class="viewer-title"></span><button class="vbtn vclose" type="button" aria-label="Close">×</button></div>
    <div class="viewer-stage"></div>
    <button class="vbtn vprev" type="button" aria-label="Previous page">←</button>
    <button class="vbtn vnext" type="button" aria-label="Next page">→</button>
    <p class="viewer-count" style="margin:0"><span></span><span class="viewer-note"></span></p>
  </div>

  <div class="shade" aria-hidden="true">Hidden While This Window Isn't Active</div>
  <script src="js/work-sample.js?v=33"></script>

</body>
</html>
